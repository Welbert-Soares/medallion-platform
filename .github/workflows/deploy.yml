name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install medallion
        run: pip install ".[databricks]"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180 # v1.23.0

      - name: Check secrets
        run: |
          if [ -z "$DATABRICKS_HOST" ];  then echo "ERRO: secret DATABRICKS_HOST não configurado";  exit 1; fi
          if [ -z "$DATABRICKS_TOKEN" ]; then echo "ERRO: secret DATABRICKS_TOKEN não configurado"; exit 1; fi
          echo "Secrets OK — host: $DATABRICKS_HOST"

      - name: Apply Catalog Structure (creates, grants, revokes; never drops)
        run: medallion-catalog-structure config/platform --apply

      - name: Ensure secret scopes of declared Connections (values are put by hand)
        run: medallion-secret-scopes config/platform

      - name: Upload CSV sources to Unity Catalog Volume
        run: |
          python3 - << 'EOF'
          from databricks.sdk import WorkspaceClient

          w = WorkspaceClient()
          with open("data/sources/ibge_municipios.csv", "rb") as f:
              w.files.upload(
                  "/Volumes/medallion_raw/sources/files/ibge_municipios.csv",
                  f,
                  overwrite=True,
              )
          print("CSV uploaded to /Volumes/medallion_raw/sources/files/")
          EOF

      - name: Deploy bundle (medallion wheel + scheduled job, no Run)
        run: databricks bundle deploy --target prod

  # dbt docs (lineage raw → gold, columns, tests) published to GitHub Pages after every deploy.
  # Generated against the warehouse so the catalog carries the real column types.
  docs:
    needs: deploy
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dbt (same range as the job's dbt environment)
        run: pip install "dbt-databricks>=1.10,<2.0"

      - name: dbt profile for the job's SQL warehouse
        run: |
          WAREHOUSE_ID=$(python3 -c "import yaml; print(yaml.safe_load(open('databricks.yml'))['variables']['warehouse_id']['default'])")
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          medallion:
            target: docs
            outputs:
              docs:
                type: databricks
                host: ${DATABRICKS_HOST#https://}
                http_path: /sql/1.0/warehouses/${WAREHOUSE_ID}
                token: "{{ env_var('DATABRICKS_TOKEN') }}"
                catalog: medallion_bronze
                schema: docs
                threads: 4
          EOF

      - name: dbt docs generate (single static page)
        working-directory: dbt
        run: |
          dbt deps --no-use-colors
          dbt docs generate --static --no-use-colors
          mkdir -p ../site && cp target/static_index.html ../site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish-docs:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
