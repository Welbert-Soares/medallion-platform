name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install medallion
        run: pip install ".[databricks]"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180 # v1.23.0

      - name: Check secrets
        run: |
          if [ -z "$DATABRICKS_HOST" ];  then echo "ERRO: secret DATABRICKS_HOST não configurado";  exit 1; fi
          if [ -z "$DATABRICKS_TOKEN" ]; then echo "ERRO: secret DATABRICKS_TOKEN não configurado"; exit 1; fi
          echo "Secrets OK — host: $DATABRICKS_HOST"

      - name: Apply Catalog Structure (creates, grants, revokes; never drops)
        run: medallion-catalog-structure config/platform --apply

      - name: Ensure secret scopes of declared Connections (values are put by hand)
        run: medallion-secret-scopes config/platform

      - name: Upload CSV sources to Unity Catalog Volume
        run: |
          python3 - << 'EOF'
          from databricks.sdk import WorkspaceClient

          w = WorkspaceClient()
          with open("data/sources/ibge_municipios.csv", "rb") as f:
              w.files.upload(
                  "/Volumes/medallion_raw/sources/files/ibge_municipios.csv",
                  f,
                  overwrite=True,
              )
          print("CSV uploaded to /Volumes/medallion_raw/sources/files/")
          EOF

      - name: Deploy bundle (medallion wheel + scheduled job, no Run)
        run: databricks bundle deploy --target prod
