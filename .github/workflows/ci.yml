name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt -e ".[dev]"

      - name: Lint Python (package, tests, notebooks, utils)
        run: ruff check src/ tests/ databricks/notebooks/ config/utils/ scripts/

      - name: Unit tests
        run: pytest

      - name: Build medallion wheel
        run: pip wheel --no-deps --wheel-dir dist .

      - name: Validate config YAMLs
        run: python scripts/validate_configs.py

      - name: Validate platform config (load_config)
        run: medallion-validate-config config/platform

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          python3 - << 'EOF'
          import pathlib
          p = pathlib.Path.home() / ".dbt" / "profiles.yml"
          profiles = ""
          for project, catalog, schema in [
              ("bronze_weather", "medallion_bronze", "weather"),
              ("bronze_ibge",    "medallion_bronze", "ibge"),
              ("silver_weather", "medallion_silver", "weather"),
              ("silver_ibge",    "medallion_silver", "ibge"),
              ("gold_weather",   "medallion_gold",   "weather"),
          ]:
              profiles += f"{project}:\n  target: ci\n  outputs:\n    ci:\n      type: databricks\n      host: placeholder\n      http_path: placeholder\n      token: placeholder\n      catalog: {catalog}\n      schema: {schema}\n      threads: 1\n"
          p.write_text(profiles)
          EOF

      - name: dbt parse (syntax + Jinja validation, no DB connection)
        run: |
          for project in bronze_weather bronze_ibge silver_weather silver_ibge gold_weather; do
            echo "=== parsing $project ==="
            cd dbt/$project
            dbt deps --profiles-dir ~/.dbt --no-use-colors
            dbt parse --profiles-dir ~/.dbt --no-use-colors
            cd ../..
          done

  bundle:
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target prod
