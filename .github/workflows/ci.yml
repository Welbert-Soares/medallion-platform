name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint Python (notebooks + utils)
        run: ruff check databricks/notebooks/ config/utils/ scripts/

      - name: Validate config YAMLs
        run: python scripts/validate_configs.py

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          python3 -c "
          import pathlib
          p = pathlib.Path.home() / '.dbt' / 'profiles.yml'
          profiles = ""
          for project, catalog, schema in [
              ("bronze_weather", "medallion_bronze", "weather"),
              ("bronze_ibge",    "medallion_bronze", "ibge"),
              ("silver_weather", "medallion_silver", "weather"),
              ("silver_ibge",    "medallion_silver", "ibge"),
              ("gold_weather",   "medallion_gold",   "weather"),
          ]:
              profiles += f"{project}:\n  target: ci\n  outputs:\n    ci:\n      type: databricks\n      host: placeholder\n      http_path: placeholder\n      token: placeholder\n      catalog: {catalog}\n      schema: {schema}\n      threads: 1\n"
          p.write_text(profiles)
          "

      - name: dbt compile (syntax check only)
        run: |
          for project in bronze_weather bronze_ibge silver_weather silver_ibge gold_weather; do
            echo "=== compiling $project ==="
            cd dbt/$project
            dbt deps --profiles-dir ~/.dbt --no-use-colors
            dbt compile --profiles-dir ~/.dbt --no-use-colors || true
            cd ../..
          done
        continue-on-error: true
