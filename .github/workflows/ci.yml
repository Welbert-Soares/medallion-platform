name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint Python
        run: ruff check src/ tests/

      - name: Unit tests
        run: pytest

      - name: Build medallion wheel
        run: pip wheel --no-deps --wheel-dir dist .

      - name: Validate platform config (load_config)
        run: medallion-validate-config config/platform

      - name: Job dbt tasks up to date (make bundle)
        run: medallion-bundle-tasks --check

      - name: Configure dbt profile (placeholder, parse never connects)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          medallion:
            target: ci
            outputs:
              ci:
                type: databricks
                host: placeholder
                http_path: placeholder
                token: placeholder
                catalog: medallion_bronze
                schema: ci
                threads: 1
          EOF

      - name: dbt parse (syntax + Jinja + the whole ref() graph, no DB connection)
        working-directory: dbt
        run: dbt parse --profiles-dir ~/.dbt --no-use-colors

  bundle:
    # Needs workspace credentials, which GitHub never passes to PRs from forks:
    # run only for branches of this repository instead of failing on every fork PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install medallion
        run: pip install ".[databricks]"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180 # v1.23.0

      - name: Validate bundle
        run: databricks bundle validate --target prod

      - name: Catalog Structure dry-run (prints the diff, changes nothing)
        run: medallion-catalog-structure config/platform
