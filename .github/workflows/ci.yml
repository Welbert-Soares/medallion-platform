name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint Python (notebooks + utils)
        run: ruff check databricks/notebooks/ config/utils/ scripts/

      - name: Validate config YAMLs
        run: python scripts/validate_configs.py

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          python3 -c "
          import pathlib
          p = pathlib.Path.home() / '.dbt' / 'profiles.yml'
          p.write_text('medallion:\n  target: ci\n  outputs:\n    ci:\n      type: databricks\n      host: placeholder\n      http_path: placeholder\n      token: placeholder\n      catalog: cli_catalog\n      schema: silver\n      threads: 1\n')
          "

      - name: dbt compile (syntax check only)
        working-directory: dbt
        run: dbt compile --profiles-dir ~/.dbt
        continue-on-error: true
