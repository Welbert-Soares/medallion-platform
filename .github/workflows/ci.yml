name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint Python (notebooks + utils)
        run: ruff check databricks/notebooks/ config/utils/ scripts/

      - name: Validate config YAMLs
        run: python scripts/validate_configs.py

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          medallion:
            target: ci
            outputs:
              ci:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: cli_catalog
                schema: silver
                threads: 4
          EOF

      - name: dbt compile
        working-directory: dbt
        run: dbt compile
        # Requer DATABRICKS_HOST, DATABRICKS_HTTP_PATH e DATABRICKS_TOKEN
        # configurados como Secrets no repositório GitHub.
        continue-on-error: ${{ secrets.DATABRICKS_HOST == '' }}
