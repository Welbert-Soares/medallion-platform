name: &project_name 'bronze_ibge'
version: '1.0.0'

profile: *project_name

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  use_materialization_v2: true
  use_managed_iceberg: true

models:
  +file_format: delta
  +persist_docs:
    relation: true
    columns: true
  +tblproperties:
    delta.logRetentionDuration: "7 days"
    delta.deletedFileRetentionDuration: "7 days"
  +databricks_tags: &project_tags
    project: *project_name

  bronze_ibge:
    +database: medallion_bronze
    +schema: ibge
    staging:
      +materialized: view
      +databricks_tags:
        <<: *project_tags
        model: "staging"
    marts:
      +materialized: table
      +databricks_tags:
        <<: *project_tags
        model: "marts"
