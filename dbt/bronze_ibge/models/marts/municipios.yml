version: 2

models:
  - name: municipios
    description: "Municípios brasileiros — referência geográfica IBGE."
    columns:
      - name: codigo_ibge
        description: "Código IBGE do município (7 dígitos)."
        data_tests:
          - not_null
          - unique
      - name: nome
        description: "Nome do município."
      - name: uf
        description: "Sigla do estado (2 letras, maiúsculas)."
      - name: capital
        description: "Indica se é capital estadual."
      - name: latitude
      - name: longitude
      - name: etl_created_date
      - name: etl_updated_date
