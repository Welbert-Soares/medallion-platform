name: 'medallion'
version: '1.0.0'
config-version: 2

profile: 'medallion'

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  medallion:
    silver:
      +materialized: incremental
      +incremental_strategy: merge
      +catalog: medallion_silver
      +tags: ["silver"]
      silver_weather:
        +schema: weather
      silver_ibge:
        +schema: ibge
    gold:
      +materialized: table
      +catalog: medallion_gold
      +tags: ["gold"]
      gold_kpi_daily:
        +schema: weather
