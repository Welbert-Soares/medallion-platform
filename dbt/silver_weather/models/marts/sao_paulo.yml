version: 2

models:
  - name: sao_paulo
    description: "Dados horários de weather de São Paulo — tipados e prontos para análise."
    columns:
      - name: measured_at
        description: "Timestamp da medição."
        data_tests:
          - not_null
          - unique
      - name: temperature_celsius
        description: "Temperatura a 2m do solo em °C."
      - name: precipitation_mm
        description: "Precipitação acumulada no período em mm."
      - name: latitude
      - name: longitude
      - name: station_id
      - name: etl_created_date
      - name: etl_updated_date
