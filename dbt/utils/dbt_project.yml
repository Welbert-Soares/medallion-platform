name: &project_name 'utils'
version: '1.0.0'

profile: *project_name

macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  use_materialization_v2: true
  use_managed_iceberg: true
  warn_error_options:
    error: all
    silence:
      - ConstraintNotEnforced
      - ConstraintNotSupported
