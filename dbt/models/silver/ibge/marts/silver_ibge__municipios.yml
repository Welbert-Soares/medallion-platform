version: 2

models:
  - name: silver_ibge__municipios
    description: "Municípios brasileiros — referência geográfica limpa e pronta para análise."
    columns:
      - name: codigo_ibge
        description: "Código IBGE do município."
        data_tests:
          - not_null
          - unique
      - name: nome
      - name: uf
      - name: is_capital
      - name: latitude
      - name: longitude
      - name: etl_created_date
      - name: etl_updated_date
