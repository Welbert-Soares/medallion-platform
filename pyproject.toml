[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medallion"
version = "0.1.0"
description = "Metadata-driven Medallion platform on Databricks"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Only for the CLI entry points run outside Databricks (serverless ships the SDK).
databricks = [
    "databricks-sdk>=0.60",
]
dev = [
    "databricks-sdk>=0.60",
    "pytest",
    "pyspark>=4.0",
    "ruff==0.16.10",
]

[project.scripts]
medallion-smoke = "medallion.smoke:main"
medallion-validate-config = "medallion.controller.config.validate:main"
medallion-catalog-structure = "medallion.databricks.catalog_structure_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion"]
exclude = ["**/ruff.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
