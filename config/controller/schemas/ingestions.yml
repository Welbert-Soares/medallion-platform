ingestions:
  type: list
  schema:
    type: dict
    schema:
      name:
        type: string
        required: true
      source:
        type: dict
        required: true
        schema:
          type:
            type: string
            allowed: [api, csv, sql]
            required: true
          connection_id:
            type: string
            required: false
          schema:
            type: string
            required: false
      target:
        type: dict
        required: true
        schema:
          container:
            type: string
            required: true
          schema:
            type: string
            required: true
      tables:
        type: list
        required: true
        schema:
          type: dict
          schema:
            name:
              type: string
              required: true
            description:
              type: string
              required: true
            name_target:
              type: string
              required: true
            type_load:
              type: string
              allowed: [merge, append, overwrite, replace_where]
              required: true
            merge_columns:
              type: string
              required: false
            params:
              type: dict
              required: true
              schema:
                flag_distinct:
                  type: boolean
                  required: true
                flag_hash_row:
                  type: boolean
                  required: true
            active:
              type: boolean
              required: true
            url:
              type: dict
              required: false
              schema:
                link:
                  type: string
                  required: true
                mode:
                  type: string
                  required: false
                params:
                  type: dict
                  required: false
                  allow_unknown: true
                flatten_method:
                  type: string
                  required: false
                data_key:
                  type: string
                  required: false
                watermark_column:
                  type: string
                  required: false
            csv:
              type: dict
              required: false
              schema:
                path:
                  type: string
                  required: true
                delimiter:
                  type: string
                  required: false
                header:
                  type: boolean
                  required: false
            sql:
              type: dict
              required: false
              schema:
                query:
                  type: string
                  required: false
                filter:
                  type: string
                  required: false
                watermark_column:
                  type: string
                  required: false
                partition_column:
                  type: string
                  required: false
