ingestions:
  - name: ibge
    source:
      type: csv
    target:
      container: medallion_raw
      schema: ibge
    tables:
      - name: ibge_municipios
        description: "Municípios brasileiros — referência geográfica IBGE (32 capitais estaduais + amostra)"
        name_target: municipios
        type_load: overwrite
        params:
          flag_distinct: true
          flag_hash_row: false
        active: true
        csv:
          path: "/Volumes/medallion_raw/sources/files/ibge_municipios.csv"
          delimiter: ";"
          header: true
