ingestions:
  - name: weather
    source:
      type: api
    target:
      container: medallion_raw
      schema: weather
    tables:
      - name: weather_sao_paulo
        description: "Temperatura e precipitação horária de São Paulo — Open Meteo API (sem autenticação)"
        name_target: sao_paulo
        type_load: append
        params:
          flag_distinct: false
          flag_hash_row: false
        # Moved to the new pipeline (config/platform), reading observed data from the Archive API.
        active: false
        url:
          link: "https://api.open-meteo.com/v1/forecast"
          mode: fixed
          params:
            latitude: -23.5505
            longitude: -46.6333
            hourly: "temperature_2m,precipitation"
            forecast_days: 1
            timezone: "America/Sao_Paulo"
          flatten_method: zip_arrays
          data_key: hourly
          watermark_column: time
