source_system: orders

ingestions:
  - name: orders_postgres
    raw_table: orders
    description: "Pedidos de um PostgreSQL de demonstração — inativa: a Connection aponta para localhost, inalcançável pelo serverless (ver docs/connections.md)"
    active: false
    source:
      type: sql
      connection_id: sql_orders_postgres
      # The Watermark condition (updated_at > last value) is added at run time.
      query: "SELECT * FROM orders"
      watermark_column: updated_at
