bundle:
  name: medallion

artifacts:
  medallion:
    type: whl
    build: python3 -m pip wheel --no-deps --wheel-dir dist .
    path: .
    # Unique wheel version per deploy, so serverless never reuses a cached wheel.
    dynamic_version: true

variables:
  warehouse_id:
    description: SQL warehouse the dbt tasks run on
    default: 12ca72db06431bb2

targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    medallion:
      name: medallion
      description: Medallion platform (bundle-managed)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: sync_config
          environment_key: medallion
          python_wheel_task:
            package_name: medallion
            entry_point: medallion-sync-config
            # The bundle syncs config/platform with the code, so a Run always uses the deployed config.
            parameters: ["--config-dir", "${workspace.file_path}/config/platform"]
        - task_key: ingest
          depends_on:
            - task_key: sync_config
          for_each_task:
            # Active Ingestions published by sync_config; each one is an independent iteration.
            inputs: "{{tasks.sync_config.values.active_ingestions}}"
            concurrency: 4
            task:
              task_key: ingest_iteration
              environment_key: medallion
              python_wheel_task:
                package_name: medallion
                entry_point: medallion-run-ingestion
                parameters:
                  - "--config-dir"
                  - "${workspace.file_path}/config/platform"
                  - "--ingestion"
                  - "{{input}}"
                  - "--run-id"
                  - "{{job.run_id}}"
                  - "--task-run-id"
                  - "{{task.run_id}}"

        # Leaf check: a Run's result comes from its leaf tasks, so without this a failed
        # Ingestion would be hidden by dbt tasks that still succeed (they run with ALL_DONE).
        - task_key: ingestions_succeeded
          depends_on:
            - task_key: ingest
          condition_task:
            op: EQUAL_TO
            left: "ok"
            right: "ok"

        # dbt: one task per Source System running `dbt build --select tag:<system>` over the single
        # dbt project (ADR 0006): bronze → silver → gold with tests in between. Each runs even if
        # some Ingestion failed, and a failure in one Source System never blocks another.
        # Generated from catalog_structure.yml + dbt/models/ by `make bundle`; CI checks it.
        # BEGIN GENERATED dbt tasks (make bundle): do not edit by hand
        - task_key: dbt_weather
          depends_on:
            - task_key: ingest
          run_if: ALL_DONE
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands: ["dbt deps", "dbt build --select tag:weather", "dbt source freshness --select source:weather"]
            warehouse_id: ${var.warehouse_id}
            catalog: medallion_bronze
            schema: weather
        - task_key: dbt_ibge
          depends_on:
            - task_key: ingest
          run_if: ALL_DONE
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands: ["dbt deps", "dbt build --select tag:ibge"]
            warehouse_id: ${var.warehouse_id}
            catalog: medallion_bronze
            schema: ibge
        # END GENERATED dbt tasks

      environments:
        - environment_key: medallion
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl
        - environment_key: dbt
          spec:
            environment_version: "4"
            dependencies:
              - dbt-databricks>=1.10,<2.0
