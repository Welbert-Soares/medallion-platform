bundle:
  name: medallion

artifacts:
  medallion:
    type: whl
    build: python3 -m pip wheel --no-deps --wheel-dir dist .
    path: .
    # Unique wheel version per deploy, so serverless never reuses a cached wheel.
    dynamic_version: true

variables:
  warehouse_id:
    description: SQL warehouse the dbt tasks run on
    default: 12ca72db06431bb2

targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    medallion:
      name: medallion
      description: Medallion platform (bundle-managed). Not scheduled yet.
      tasks:
        - task_key: sync_config
          environment_key: medallion
          python_wheel_task:
            package_name: medallion
            entry_point: medallion-sync-config
            # The bundle syncs config/platform with the code, so a Run always uses the deployed config.
            parameters: ["--config-dir", "${workspace.file_path}/config/platform"]
        - task_key: ingest
          depends_on:
            - task_key: sync_config
          for_each_task:
            # Active Ingestions published by sync_config; each one is an independent iteration.
            inputs: "{{tasks.sync_config.values.active_ingestions}}"
            concurrency: 4
            task:
              task_key: ingest_iteration
              environment_key: medallion
              python_wheel_task:
                package_name: medallion
                entry_point: medallion-run-ingestion
                parameters:
                  - "--config-dir"
                  - "${workspace.file_path}/config/platform"
                  - "--ingestion"
                  - "{{input}}"
                  - "--run-id"
                  - "{{job.run_id}}"
                  - "--task-run-id"
                  - "{{task.run_id}}"

        # Leaf check: a Run's result comes from its leaf tasks, so without this a failed
        # Ingestion would be hidden by dbt tasks that still succeed (they run with ALL_DONE).
        - task_key: ingestions_succeeded
          depends_on:
            - task_key: ingest
          condition_task:
            op: EQUAL_TO
            left: "ok"
            right: "ok"

        # dbt: one task per project, bronze → silver → gold per Source System. Bronze runs
        # even if some Ingestion failed; a failure in one Source System never blocks another.
        # project_directory is the whole dbt/ folder: the task copies it to /tmp, and only then
        # does the shared ../utils package resolve. dbt/dbt_project.yml names the profile.
        - task_key: dbt_bronze_ibge
          depends_on:
            - task_key: ingest
          run_if: ALL_DONE
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands: ["dbt deps --project-dir bronze_ibge", "dbt build --project-dir bronze_ibge --profile medallion"]
            warehouse_id: ${var.warehouse_id}
            catalog: medallion_bronze
            schema: ibge
        - task_key: dbt_silver_ibge
          depends_on:
            - task_key: dbt_bronze_ibge
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands: ["dbt deps --project-dir silver_ibge", "dbt build --project-dir silver_ibge --profile medallion"]
            warehouse_id: ${var.warehouse_id}
            catalog: medallion_silver
            schema: ibge
        - task_key: dbt_bronze_weather
          depends_on:
            - task_key: ingest
          run_if: ALL_DONE
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands: ["dbt deps --project-dir bronze_weather", "dbt build --project-dir bronze_weather --profile medallion"]
            warehouse_id: ${var.warehouse_id}
            catalog: medallion_bronze
            schema: weather
        - task_key: dbt_silver_weather
          depends_on:
            - task_key: dbt_bronze_weather
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands: ["dbt deps --project-dir silver_weather", "dbt build --project-dir silver_weather --profile medallion"]
            warehouse_id: ${var.warehouse_id}
            catalog: medallion_silver
            schema: weather
        - task_key: dbt_gold_weather
          depends_on:
            - task_key: dbt_silver_weather
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands: ["dbt deps --project-dir gold_weather", "dbt build --project-dir gold_weather --profile medallion"]
            warehouse_id: ${var.warehouse_id}
            catalog: medallion_gold
            schema: weather

      environments:
        - environment_key: medallion
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl
        - environment_key: dbt
          spec:
            environment_version: "4"
            dependencies:
              - dbt-databricks>=1.10,<2.0
